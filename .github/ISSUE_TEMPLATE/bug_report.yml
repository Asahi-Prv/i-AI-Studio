name: Bug report
description: Report a problem with Intel AI Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.
        **Do not report security vulnerabilities here** — see
        [SECURITY.md](https://github.com/Asahi-Prv/i-AI-Studio/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: I am using the latest release or the `main` branch.
          required: true
        - label: I removed any tokens, API keys, and personal paths from the logs below.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Relevant output from **Settings → Logs**, the task panel, or the browser console.
        For model load failures, include the OVMS error line.
      render: text
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: Intel AI Studio version / commit
      placeholder: "e.g. 0.1.0 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu 24.04
        - Other Linux (describe below)
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Packaged executable (Intel-AI-Studio.exe / Intel-AI-Studio)
        - From source (run.bat / run.sh / python -m app.main)
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: OVMS runtime version
      description: Shown in Settings → OpenVINO Model Server runtime.
      placeholder: "e.g. 2026.2.0 or weekly-2026.5.0"
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "e.g. OpenVINO/Qwen3-8B-int4-ov"
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - CPU
        - GPU
        - NPU
        - AUTO
        - N/A
    validations:
      required: false

  - type: input
    id: python
    attributes:
      label: Python version (source runs only)
      placeholder: "e.g. 3.12.9"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Additional context, workarounds you found, or related issues.
    validations:
      required: false
