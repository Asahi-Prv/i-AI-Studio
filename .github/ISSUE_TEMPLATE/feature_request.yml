name: Feature request
description: Suggest an idea or improvement for Intel AI Studio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Intel AI Studio! Please describe the problem first,
        then your proposed solution.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
        - label: This request is about the manager UI/backend, not about OVMS or model quality itself.
          required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Mockups or example workflows are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried or other approaches you thought of.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related tools, links, screenshots, or anything else.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature.
          required: false
